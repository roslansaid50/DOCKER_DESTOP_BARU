apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-argocd-provisioning
  namespace: default
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: Argo CD
        orgId: 1
        folder: Argo CD
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/argocd
      - name: Applications
        orgId: 1
        folder: Applications
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/apps
      - name: Cluster
        orgId: 1
        folder: Cluster
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/cluster
  argocd-overview.json: |
    {
      "id": null,
      "uid": "argocd-overview",
      "title": "Argo CD Overview",
      "tags": ["argocd", "gitops"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Argo CD Applications", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(argocd_app_info)", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 2, "type": "stat", "title": "Out of Sync", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"}) or vector(0)", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 3, "type": "stat", "title": "Unhealthy", "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(argocd_app_info{health_status!=\"Healthy\"}) or vector(0)", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 4, "type": "stat", "title": "Metrics Targets Up", "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(up{job=~\"argocd-.*\"})", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 2}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 5, "type": "timeseries", "title": "Argo CD Controller CPU", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "rate(process_cpu_seconds_total{job=\"argocd-controller\"}[5m])", "legendFormat": "controller", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}},
        {"id": 6, "type": "timeseries", "title": "Argo CD Controller Memory", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "process_resident_memory_bytes{job=\"argocd-controller\"}", "legendFormat": "controller RSS", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}},
        {"id": 7, "type": "timeseries", "title": "Reconciliation Queue Depth", "gridPos": {"h": 8, "w": 24, "x": 0, "y": 13}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "workqueue_depth{controller=\"app_reconciliation_queue\"}", "legendFormat": "{{name}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: dashboard-provider.yaml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /var/lib/grafana/dashboards/argocd/argocd-overview.json
              subPath: argocd-overview.json
              readOnly: true
            - name: grafana-apps-dashboard
              mountPath: /var/lib/grafana/dashboards/apps
              readOnly: true
            - name: grafana-cluster-dashboard
              mountPath: /var/lib/grafana/dashboards/cluster
              readOnly: true
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-provisioning
          configMap:
            name: grafana-argocd-provisioning
        - name: grafana-apps-dashboard
          configMap:
            name: grafana-apps-dashboard
        - name: grafana-cluster-dashboard
          configMap:
            name: grafana-cluster-dashboard
        - name: grafana-github-dashboard
          configMap:
            name: grafana-github-dashboard