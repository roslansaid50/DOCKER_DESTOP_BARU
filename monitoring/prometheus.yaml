apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: argocd-controller
        metrics_path: /metrics
        static_configs:
          - targets: [argocd-metrics.argocd.svc.cluster.local:8082]
      - job_name: argocd-server
        metrics_path: /metrics
        static_configs:
          - targets: [argocd-server-metrics.argocd.svc.cluster.local:8083]
      - job_name: argocd-applicationset
        metrics_path: /metrics
        static_configs:
          - targets: [argocd-applicationset-controller.argocd.svc.cluster.local:8080]
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.default.svc.cluster.local:8080]
      - job_name: prometheus
        metrics_path: /metrics
        static_configs:
          - targets: [prometheus.default.svc.cluster.local:9090]
      - job_name: grafana
        metrics_path: /metrics
        static_configs:
          - targets: [grafana.default.svc.cluster.local:3000]
      - job_name: blackbox-exporter
        metrics_path: /metrics
        static_configs:
          - targets: [blackbox-exporter.default.svc.cluster.local:9115]
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: job
            replacement: node-exporter
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: keep
            regex: \\d+
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: app-probes
        metrics_path: /probe
        params:
          module: [http_app]
        static_configs:
          - targets: [http://wordpress.default.svc.cluster.local/wp-login.php]
            labels:
              app: wordpress
          - targets: [http://ojs.default.svc.cluster.local/index/en/install]
            labels:
              app: ojs
          - targets: [http://phpmyadmin.default.svc.cluster.local/]
            labels:
              app: phpmyadmin
          - targets: [http://grafana.default.svc.cluster.local:3000/api/health]
            labels:
              app: grafana
          - targets: [http://prometheus.default.svc.cluster.local:9090/-/ready]
            labels:
              app: prometheus
          - targets: [http://headlamp.kube-system.svc.cluster.local/]
            labels:
              app: headlamp
          - targets: [http://argocd-server.argocd.svc.cluster.local/healthz]
            labels:
              app: argocd
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: default
data:
  blackbox.yml: |
    modules:
      http_app:
        prober: http
        timeout: 10s
        http:
          method: GET
          preferred_ip_protocol: ip4
          follow_redirects: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.27.0
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-cluster-reader
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
