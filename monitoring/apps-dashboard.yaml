apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-apps-dashboard
  namespace: default
data:
  github-repository.json: |
     {
       "id": null,
       "uid": "github-repository-overview",
       "title": "GitHub Repository Overview",
       "tags": ["github", "repository", "gitops"],
       "timezone": "browser",
       "schemaVersion": 39,
       "version": 1,
       "refresh": "5m",
       "time": {"from": "now-7d", "to": "now"},
       "panels": [
         {"id": 1, "type": "stat", "title": "Stars", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_stars{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
         {"id": 2, "type": "stat", "title": "Forks", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_forks{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "orange", "value": null}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
         {"id": 3, "type": "stat", "title": "Open Issues and PRs", "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_open_issues{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"} + github_repo_pull_request_count{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
         {"id": 4, "type": "stat", "title": "Repository Size", "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_size_kb{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "kbytes"}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
         {"id": 5, "type": "timeseries", "title": "Stars and Forks", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_stars{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "legendFormat": "Stars", "refId": "A"}, {"expr": "github_repo_forks{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "legendFormat": "Forks", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}},
         {"id": 6, "type": "timeseries", "title": "Open Issues and Pull Requests", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_open_issues{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "legendFormat": "Issues", "refId": "A"}, {"expr": "github_repo_pull_request_count{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "legendFormat": "Pull requests", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}},
         {"id": 7, "type": "timeseries", "title": "Release Downloads", "gridPos": {"h": 8, "w": 24, "x": 0, "y": 13}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "github_repo_release_downloads{user=\"roslansaid50\",repo=\"DOCKER_DESTOP_BARU\"}", "legendFormat": "{{release}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}}
       ]
     }
  wordpress-ojs.json: |

    {
      "id": null,
      "uid": "wordpress-ojs-monitoring",
      "title": "WordPress and OJS Availability",
      "tags": ["wordpress", "ojs", "availability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "WordPress Availability", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_success{app=\"wordpress\"}", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "none", "justifyMode": "auto"}},
        {"id": 2, "type": "stat", "title": "OJS Availability", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_success{app=\"ojs\"}", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "none", "justifyMode": "auto"}},
        {"id": 3, "type": "timeseries", "title": "App Response Time", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_duration_seconds{app=~\"wordpress|ojs\"}", "legendFormat": "{{app}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}},
        {"id": 4, "type": "timeseries", "title": "HTTP Status Code", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_http_status_code{app=~\"wordpress|ojs\"}", "legendFormat": "{{app}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "single"}}},
        {"id": 5, "type": "timeseries", "title": "App Availability", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "probe_success{app=~\"wordpress|ojs\"}", "legendFormat": "{{app}}", "refId": "A"}], "fieldConfig": {"defaults": {"min": 0, "max": 1, "unit": "percentunit"}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cluster-dashboard
  namespace: default
data:
  cluster-overview.json: |
    {
      "id": null,
      "uid": "k8s-cluster-overview",
      "title": "Kubernetes Cluster Overview",
      "tags": ["kubernetes", "cluster", "nodes", "pods"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Nodes Ready", "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A"}], "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 2, "type": "stat", "title": "Pods Running", "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "orange", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 3, "type": "stat", "title": "Pods Not Ready", "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"}) or vector(0)", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 4, "type": "stat", "title": "Scrape Targets Up", "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(up{job=~\"node-exporter|kube-state-metrics\"})", "refId": "A"}], "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"}},
        {"id": 5, "type": "timeseries", "title": "Node CPU Usage", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 - (avg by (instance,node) (rate(node_cpu_seconds_total{mode=\"idle\",job=\"node-exporter\"}[5m])) * 100)", "legendFormat": "{{node}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}},
        {"id": 6, "type": "timeseries", "title": "Node Memory Usage", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"})", "legendFormat": "{{node}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}},
        {"id": 7, "type": "timeseries", "title": "Pods by Namespace and Phase", "gridPos": {"h": 8, "w": 24, "x": 0, "y": 13}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (namespace,phase) (kube_pod_status_phase)", "legendFormat": "{{namespace}} / {{phase}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}},
        {"id": 8, "type": "timeseries", "title": "Container Restarts", "gridPos": {"h": 8, "w": 24, "x": 0, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (namespace,pod) (kube_pod_container_status_restarts_total)", "legendFormat": "{{namespace}} / {{pod}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []}, "options": {"legend": {"showLegend": true}, "tooltip": {"mode": "multi"}}}
      ]
    }
